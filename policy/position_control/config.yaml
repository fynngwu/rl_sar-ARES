position_control:
  # MIT position control gains used only by GAIT mode.
  # torque_limits are still loaded from the selected policy config.
  # Driver joint order: HipA[0..3], HipF/thigh[4..7], Knee[8..11].
  joints:
    hip:
      kp: 40.0
      kd: 2.0
    thigh:
      kp: 40.0
      kd: 2.0
    knee:
      kp: 40.0
      kd: 2.0

  motion:
    period: 0.5
    duty_factor: 0.5
    step_height: 0.10
    max_stride: 0.18
    foot_center_x: -0.05
    stride_scale_default: 1.0
    stride_scale_min: 0.4
    stride_scale_max: 1.6
    stride_scale_step: 0.1

  # Torque limits (same as CTS policy)
  torque_limits: 17

  # Position limits (same as CTS policy, driver order: HipA LF/LR/RF/RR, HipF LF/LR/RF/RR, Knee LF/LR/RF/RR)
  position_limits:
    # HipA
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    # HipF
    - [-1.2217658,  0.8726683]
    - [-1.2217305,  0.8726683]
    - [-0.8726999,  1.2217342]
    - [-0.8726999,  1.2217305]
    # Knee
    - [-1.0217299,  0.8]
    - [-1.0217299,  0.8]
    - [-0.8,        1.0217287]
    - [-0.8,        1.0217287]

  # Jump trajectory (RB+A from STAND)
  jump:
    keyframes:
      - theta: -10
        r: 0.3
        duration: 0.1
        mode: smooth
      # 蓄力: 腿向前收 
      - theta: -30
        r: 0.13
        duration: 0.3
        mode: smooth
      # 蹬地: 腿向后下蹬出 
      - theta: -40
        r: 0.4
        duration: 0.1
        mode: step
      # 空中收腿: 腿向前收 
      - theta: -30
        r: 0.18
        duration: 0.1
        mode: smooth
