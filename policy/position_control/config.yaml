position_control:
  # MIT position control gains used only by GAIT mode.
  # torque_limits are still loaded from the selected policy config.
  # Driver joint order: HipA[0..3], HipF/thigh[4..7], Knee[8..11].
  joints:
    hip:
      kp: 40.0
      kd: 2.0
    thigh:
      kp: 40.0
      kd: 2.0
    knee:
      kp: 40.0
      kd: 2.0

  motion:
    period: 0.5
    duty_factor: 0.5
    step_height: 0.10
    max_stride: 0.18
    foot_center_x: -0.05
    stride_scale_default: 1.0
    stride_scale_min: 0.4
    stride_scale_max: 1.6
    stride_scale_step: 0.1

  # Torque limits (same as CTS policy)
  torque_limits: 17

  # Position limits (same as CTS policy, driver order: HipA LF/LR/RF/RR, HipF LF/LR/RF/RR, Knee LF/LR/RF/RR)
  position_limits:
    # HipA
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    - [-0.7853982,  0.7853982]
    # HipF
    - [-1.2217658,  0.8726683]
    - [-1.2217305,  0.8726683]
    - [-0.8726999,  1.2217342]
    - [-0.8726999,  1.2217305]
    # Knee
    - [-1.0217299,  0.8]
    - [-1.0217299,  0.8]
    - [-0.8,        1.0217287]
    - [-0.8,        1.0217287]

  # Jump trajectory (RB+A from STAND)
  jump:
    keyframes:
      - theta: -10
        r: 0.3
        duration: 0.1
        mode: smooth
      # 蓄力: 腿向前收 
      - theta: -30
        r: 0.13
        duration: 0.3
        mode: smooth
      # 蹬地: 腿向后下蹬出 
      - theta: -40
        r: 0.4
        duration: 0.1
        mode: step
      # 空中收腿: 腿向前收 
      - theta: -30
        r: 0.18
        duration: 0.1
        mode: smooth

  # Climb-over-wall sequence (RB+Y from STAND).
  # Feet are in each hip frame [m]. Current IK clamps x/z to the controller workspace,
  # so these defaults are intentionally conservative and should be tuned on a protected robot.
  climb:
    dt: 0.02
    start_feet:
      LF: {x: -0.05, y: 0.0, z: -0.30}
      RF: {x: -0.05, y: 0.0, z: -0.30}
      LH: {x: -0.05, y: 0.0, z: -0.30}
      RH: {x: -0.05, y: 0.0, z: -0.30}
    phases:
      # 1) Front legs climb onto the wall/top edge while rear legs keep support.
      - name: front_legs_on_wall
        duration: 1.00
        mode: smooth
        feet:
          LF: {x: 0.14, y: 0.0, z: -0.15}
          RF: {x: 0.14, y: 0.0, z: -0.15}
          LH: {x: -0.08, y: 0.0, z: -0.30}
          RH: {x: -0.08, y: 0.0, z: -0.30}
      # 2) Rear legs push while front legs move to the landing side.
      - name: rear_push_front_land
        duration: 0.80
        mode: smooth
        feet:
          LF: {x: 0.08, y: 0.0, z: -0.30}
          RF: {x: 0.08, y: 0.0, z: -0.30}
          LH: {x: -0.15, y: 0.0, z: -0.35}
          RH: {x: -0.15, y: 0.0, z: -0.35}
      # 3) Rear legs tuck over the wall.
      - name: rear_legs_tuck
        duration: 0.80
        mode: smooth
        feet:
          LF: {x: -0.02, y: 0.0, z: -0.30}
          RF: {x: -0.02, y: 0.0, z: -0.30}
          LH: {x: 0.12, y: 0.0, z: -0.15}
          RH: {x: 0.12, y: 0.0, z: -0.15}
      # 4) Rear legs land and recover neutral stand.
      - name: rear_legs_land
        duration: 1.00
        mode: smooth
        feet:
          LF: {x: -0.05, y: 0.0, z: -0.30}
          RF: {x: -0.05, y: 0.0, z: -0.30}
          LH: {x: -0.05, y: 0.0, z: -0.30}
          RH: {x: -0.05, y: 0.0, z: -0.30}
